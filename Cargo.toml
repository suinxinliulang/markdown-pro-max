[workspace]
resolver = "3"
members = ["crates/markdownpromax-core", "crates/markdownpromax-asset", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
markdownpromax-core = { path = "crates/markdownpromax-core" }
markdownpromax-asset = { path = "crates/markdownpromax-asset" }
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

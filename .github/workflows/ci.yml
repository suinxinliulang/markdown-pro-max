name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Rust core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy -p markdownpromax-core -p markdownpromax-asset --all-targets -- -D warnings
      - name: Test
        run: cargo test -p markdownpromax-core -p markdownpromax-asset --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck & build
        run: pnpm build
      - name: Unit tests
        run: pnpm test

  app:
    name: App / ${{ matrix.os }}
    needs: [core, frontend]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      # 只验证三端都能编译通过，安装包留给发布流程（M5）。
      - name: Build (no bundle)
        run: pnpm tauri build --no-bundle
